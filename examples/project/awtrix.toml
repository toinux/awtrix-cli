[project]
name = "example-project"
version = "0.1.0"

[[modules]]
name = "helpers"
file = "src/helpers.be"

[[resources]]
path = "/ICONS/project.gif"
file = "assets/project.gif"

[[scripts]]
name = "main"
file = "src/main.be"
create = true

[tests]
window_secs = 5

[[tests.assertion]]
name = "main-remains-active"
script_active = "main"

[[tests.assertion]]
name = "headless-runtime-log"
log_contains = "vm heap"
