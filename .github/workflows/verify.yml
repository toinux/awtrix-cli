name: Verify and package

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  host-test:
    name: host-test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --locked
      - name: Verify native self-update behavior
        run: cargo test --locked --test cli update_
      - name: Build standalone binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify packaged binary CLI and HTTP
        env:
          AWTRIX_DISTRIBUTION_BINARY: target/${{ matrix.target }}/release/awtrix-cli${{ matrix.suffix }}
        run: cargo test --locked --test distribution
      - name: Verify skill installers
        env:
          AWTRIX_DISTRIBUTION_BINARY: target/${{ matrix.target }}/release/awtrix-cli${{ matrix.suffix }}
        run: python tests/skill-installers/test_installers.py -v
      - name: Verify release artifact layout contract
        run: python tests/release-artifact-contract.py
      - name: Verify agent implementation workflow gates
        run: python tests/agent-workflow/test_implementation_gate.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: awtrix-cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/awtrix-cli${{ matrix.suffix }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: host-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "awtrix-cli") | .version')"
          test "$TAG" = "v$version" || { echo "tag $TAG does not match package version v$version" >&2; exit 1; }
          case "$version" in *-*|*+*) echo "release versions must be stable (no prerelease/build metadata): $version" >&2; exit 1 ;; esac
      - uses: actions/download-artifact@v4
        with:
          pattern: awtrix-cli-*
          path: artifacts
          merge-multiple: false
      - name: Assemble release assets and checksums
        run: |
          set -euo pipefail
          mkdir release-assets
          install -m 0755 artifacts/awtrix-cli-x86_64-unknown-linux-gnu/awtrix-cli release-assets/awtrix-cli-x86_64-unknown-linux-gnu
          install -m 0755 artifacts/awtrix-cli-aarch64-apple-darwin/awtrix-cli release-assets/awtrix-cli-aarch64-apple-darwin
          install -m 0755 artifacts/awtrix-cli-x86_64-pc-windows-msvc/awtrix-cli.exe release-assets/awtrix-cli-x86_64-pc-windows-msvc.exe
          (cd release-assets && sha256sum awtrix-cli-x86_64-unknown-linux-gnu awtrix-cli-aarch64-apple-darwin awtrix-cli-x86_64-pc-windows-msvc.exe > SHA256SUMS)
          test "$(wc -l < release-assets/SHA256SUMS)" -eq 3
      - name: Create draft release, upload assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [ "$is_draft" = "false" ]; then
              actual_assets="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | sort | join("\n")')"
              expected_assets="$(printf '%s\n' awtrix-cli-aarch64-apple-darwin awtrix-cli-x86_64-pc-windows-msvc.exe awtrix-cli-x86_64-unknown-linux-gnu SHA256SUMS | sort)"
              test "$actual_assets" = "$expected_assets" || { echo "published release asset set differs; refusing to mutate published release" >&2; exit 1; }
              mkdir existing-assets
              gh release download "$TAG" --dir existing-assets
              cmp release-assets/SHA256SUMS existing-assets/SHA256SUMS || { echo "published checksums differ; refusing to mutate published release" >&2; exit 1; }
              (cd existing-assets && sha256sum -c SHA256SUMS)
              echo "Published release already matches; leaving immutable assets unchanged."
              exit 0
            fi
          else
            gh release create "$TAG" --draft --title "$TAG" --notes "AWTRIX CLI $TAG"
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false" ]; then
            exit 0
          else
            gh release edit "$TAG" --draft
          fi
          gh release upload "$TAG" release-assets/* --clobber
          gh release edit "$TAG" --draft=false --latest

  release-install:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install published binary on Linux or macOS
        if: runner.os != 'Windows'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh skills/awtrix-cli/scripts/install.sh --version "$TAG" --install-dir "$RUNNER_TEMP/awtrix-cli/bin"
          "$RUNNER_TEMP/awtrix-cli/bin/awtrix-cli" --version
          "$RUNNER_TEMP/awtrix-cli/bin/awtrix-cli" --help
      - name: Install published binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'awtrix-cli\bin'
          & .\skills\awtrix-cli\scripts\install.ps1 -Version $env:TAG -InstallDir $bin
          if ($LASTEXITCODE -ne 0) { throw 'Release installation failed.' }
          & (Join-Path $bin 'awtrix-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed version check failed.' }
          & (Join-Path $bin 'awtrix-cli.exe') --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed help check failed.' }
