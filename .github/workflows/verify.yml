name: Verify and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        if: runner.os == 'Linux'
        run: cargo test
      - name: Build standalone binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify packaged binary CLI and HTTP
        env:
          AWTRIX_DISTRIBUTION_BINARY: target/${{ matrix.target }}/release/awtrix-cli${{ matrix.suffix }}
        run: cargo test --test distribution

  package:
    needs: host-test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: awtrix-cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/awtrix-cli${{ matrix.suffix }}
