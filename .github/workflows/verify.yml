name: Verify and package

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  host-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --locked
      - name: Build standalone binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify packaged binary CLI and HTTP
        env:
          AWTRIX_DISTRIBUTION_BINARY: target/${{ matrix.target }}/release/awtrix-cli${{ matrix.suffix }}
        run: cargo test --test distribution
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: awtrix-cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/awtrix-cli${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: host-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "awtrix-cli") | .version')"
          test "$TAG" = "v$version" || { echo "tag $TAG does not match package version v$version" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: awtrix-cli-*
          path: artifacts
          merge-multiple: true
      - name: Assemble release assets and checksums
        run: |
          set -euo pipefail
          mkdir release-assets
          install -m 0755 artifacts/awtrix-cli-x86_64-unknown-linux-gnu release-assets/awtrix-cli-x86_64-unknown-linux-gnu
          install -m 0755 artifacts/awtrix-cli-aarch64-apple-darwin release-assets/awtrix-cli-aarch64-apple-darwin
          install -m 0755 artifacts/awtrix-cli-x86_64-pc-windows-msvc.exe release-assets/awtrix-cli-x86_64-pc-windows-msvc.exe
          (cd release-assets && sha256sum awtrix-cli-x86_64-unknown-linux-gnu awtrix-cli-aarch64-apple-darwin awtrix-cli-x86_64-pc-windows-msvc.exe > SHA256SUMS)
          test "$(wc -l < release-assets/SHA256SUMS)" -eq 3
      - name: Create draft release and upload all assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "AWTRIX CLI $TAG"
          else
            gh release edit "$TAG" --draft
          fi
          gh release upload "$TAG" release-assets/* --clobber
      - name: Publish stable release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
