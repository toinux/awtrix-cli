[package]
name = "awtrix"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "awtrix"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
tempfile = "3"

[dev-dependencies]
tiny_http = "0.12"
