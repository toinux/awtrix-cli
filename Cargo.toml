[package]
name = "awtrix"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "awtrix"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
ctrlc = "3"
png = "0.17"
tempfile = "3"
libc = "0.2"

[dev-dependencies]
tiny_http = "0.12"
