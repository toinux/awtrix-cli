[package]
name = "awtrix-cli"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "awtrix-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
ctrlc = "3"
png = "0.17"
tempfile = "3"
sha2 = "0.10"
self-replace = "1.5"
libc = "0.2"

[dev-dependencies]
tiny_http = "0.12"
